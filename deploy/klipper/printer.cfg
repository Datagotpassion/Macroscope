# PlateScope motion — SKR Pico V1.0 · CoreXY (camera) + single Z (plate)
# ---------------------------------------------------------------------------
# Restore after a Pi reflash:
#   1. Reinstall Klipper host + Moonraker + Fluidd (KIAUH).
#   2. cp ~/Macroscope/deploy/klipper/printer.cfg ~/printer_data/config/printer.cfg
#   3. FIRMWARE_RESTART  (reconnects to the Pico — firmware persists on the RP2040)
#
# CoreXY moves the camera; a single Z (two motors wired IN SERIES to one driver)
# moves the plate for focus. Sensorless XY homing (TMC2209 StallGuard) is ENABLED
# below — tune driver_SGTHRS if homing triggers early (lower) or grinds (raise).

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_504434040880BB1C-if00
restart_method: command

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 1000          # lower (e.g. 500) if the frame flexes at speed
max_z_velocity: 10
max_z_accel: 100

[force_move]
enable_force_move: True  # lets us jog a single motor if needed

# Direction calibration (verified 2026-07): motors SWAPPED + both dir_pins
# INVERTED so +X and +Y both move into the work area, HOME corner = origin (0,0).
# Net effect: logical stepper_x drives the physical Y-port driver (addr 2) & v.v.

# --- X (drives physical Y-port driver) ---
[stepper_x]
step_pin: gpio6
dir_pin: !gpio5
enable_pin: !gpio7
microsteps: 16
rotation_distance: 40    # GT2 belt + 20T pulley — adjust to your pulley
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_max: 325        # measured X travel (mm)
homing_speed: 20
homing_retract_dist: 0   # required 0 for sensorless
[tmc2209 stepper_x]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 2
run_current: 0.80        # RMS; motor rated 1.7A peak -> ceiling ~1.2A RMS
stealthchop_threshold: 0 # StallGuard needs spreadcycle
diag_pin: ^gpio3         # X-driver DIAG on the Y-STOP header pin
driver_SGTHRS: 60        # tuned sensitivity

# --- Y (drives physical X-port driver) ---
[stepper_y]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 0
position_max: 230        # measured Y travel (mm)
homing_speed: 20
homing_retract_dist: 0
[tmc2209 stepper_y]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 0
run_current: 0.80
stealthchop_threshold: 0
diag_pin: ^gpio4
driver_SGTHRS: 50        # tuned sensitivity

# --- Z = plate focus · TWO motors in SERIES on the one Z driver ---
[stepper_z]
step_pin: gpio19
dir_pin: gpio28
enable_pin: !gpio2
microsteps: 16
rotation_distance: 8     # T8 leadscrew lead 8mm — adjust to your screw
endstop_pin: gpio25      # Z-STOP header
position_endstop: 0
position_max: 60         # <-- set to real Z travel (mm)
position_min: -2
homing_speed: 5
[tmc2209 stepper_z]
uart_pin: gpio9
tx_pin: gpio8
uart_address: 1
run_current: 0.80        # shared by both series motors — keep modest
stealthchop_threshold: 999999

# --- Direction-check helpers (run from the Fluidd console) ---
[gcode_macro WIGGLE]
description: Oscillate an axis in place. AXIS=X|Y DIST=15 N=8
gcode:
    {% set axis = params.AXIS|default('X')|upper %}
    {% set dist = params.DIST|default(15)|float %}
    {% set n = params.N|default(8)|int %}
    SET_KINEMATIC_POSITION X=100 Y=100 Z=0
    G90
    {% for i in range(n) %}
        G1 {axis}{100 + dist} F2000
        G1 {axis}{100 - dist} F2000
    {% endfor %}
    G1 {axis}100 F2000

[gcode_macro AXIS_DIR]
description: Slow one-way move to reveal + direction. AXIS=X|Y DIST=25
gcode:
    {% set axis = params.AXIS|default('X')|upper %}
    {% set dist = params.DIST|default(25)|float %}
    SET_KINEMATIC_POSITION X=100 Y=100 Z=0
    G90
    G4 P1000
    G1 {axis}{100 + dist} F600
    G4 P2000
    G1 {axis}100 F600
